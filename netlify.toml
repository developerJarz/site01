[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  # Build output and local tooling/test folders are not deployable secret sources.
  SECRETS_SCAN_OMIT_PATHS = ".next/**,.netlify/**,graphify-out/**,.agents/**,tests/**"
  # These env vars hold public configuration (site URL, SMTP host/port/sender,
  # Auth0 tenant domain), not secrets. Their values legitimately appear in the
  # code, so exclude them from Netlify's secrets scanner.
  SECRETS_SCAN_OMIT_KEYS = "NEXTAUTH_URL,APP_BASE_URL,URL,SMTP_HOST,SMTP_PORT,SMTP_FROM,AUTH0_DOMAIN,AUTH0_ISSUER"

[dev]
  command = "npm run dev"
  targetPort = 3000
  framework = "nextjs"

# Security headers applied to all routes
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self'; img-src 'self' data: blob: https://images.unsplash.com https://res.cloudinary.com; frame-src 'self' blob: https://res.cloudinary.com; script-src 'self' 'unsafe-eval' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' https://*.mongodb.net https://api.brevo.com; frame-ancestors 'self';"
